<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodCare | Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="login-page">

    <!-- Background -->
    <div class="login-background"></div>

    <!-- Login Container -->
    <main class="login-container">

        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <div class="login-icon">🩸</div>

                <h1>BloodCare</h1>

                <p>
                    Blood Donation Management System
                </p>
            </div>


            <!-- Login Title -->
            <div class="login-heading">

                <h2>Welcome Back</h2>

                <p>
                    Login to access the management system.
                </p>

            </div>


            <!-- Login Form -->
            <form action="#" method="POST">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <div class="password-label">

                        <label for="password">
                            Password
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>
                <!-- Remember Me -->
                <div class="remember">
                    <label>
                        <input
                            type="checkbox"
                            name="remember"
                        >
                        Remember me
                    </label>
                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-submit"
                >
                    Login
                </button>
                <div class="create-account">
    <p>Don't have an account?</p>
    <a href="user.html">Create an Account</a>
</div>

            </form>


            <!-- Back to Website -->
            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </main>

</body>
</html>
