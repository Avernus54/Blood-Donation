<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodCare | Donor Registration</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="register-page">

    <!-- Background -->
    <div class="register-background"></div>

    <!-- Registration Container -->
    <main class="register-container">

        <div class="register-card">

            <!-- Header -->
            <div class="register-header">

                <div class="register-icon">
                    🩸
                </div>

                <h1>BloodCare</h1>

                <p>Blood Donation Management System</p>

            </div>

            <!-- Title -->
            <div class="register-heading">

                <h2>Create an Account</h2>

                <p>
                    Register as a blood donor and help save lives.
                </p>

            </div>

            <!-- Form -->
            <form action="#" method="POST">

                <!-- Personal Information -->
                <div class="form-section">

                    <h3>Personal Information</h3>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="first_name">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="first_name"
                                name="first_name"
                                placeholder="Enter first name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="last_name">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="last_name"
                                name="last_name"
                                placeholder="Enter last name"
                                required
                            >
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="birthdate">
                                Date of Birth
                            </label>

                            <input
                                type="date"
                                id="birthdate"
                                name="birthdate"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="gender">
                                Gender
                            </label>

                            <select
                                id="gender"
                                name="gender"
                                required
                            >
                                <option value="">Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                    </div>

                </div>


                <!-- Contact Information -->
                <div class="form-section">

                    <h3>Contact Information</h3>

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="address">
                            Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            rows="3"
                            placeholder="Enter your complete address"
                            required
                        ></textarea>

                    </div>

                </div>


                <!-- Blood Information -->
                <div class="form-section">

                    <h3>Blood Information</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="blood_type">
                                Blood Type
                            </label>
                            <select
                                id="blood_type"
                                name="blood_type"
                                required
                            >
                                <option value="">
                                    Select blood type
                                </option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="weight">
                                Weight (kg)
                            </label>
                            <input
                                type="number"
                                id="weight"
                                name="weight"
                                placeholder="e.g. 60"
                                min="1"
                                required
                            >
                        </div>
                    </div>
                </div>
                <!-- Account Information -->
                <div class="form-section">
                    <h3>Account Information</h3>
                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">
                            Confirm Password
                        </label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required
                        >
                    </div>
                </div>
                <!-- Terms -->
                <div class="terms">

                    <label>
                        <input
                            type="checkbox"
                            name="terms"
                            required
                        >
                        <span>
                            I agree to the terms and conditions.
                        </span>
                    </label>
                </div>
                <!-- Submit -->
                <button
                    type="submit"
                    class="register-submit"
                >
                    Create Account
                </button>
            </form>


            <!-- Login Link -->
            <div class="already-account">
                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>


            <!-- Back -->
            <div class="back-home">
                <a href="index.html">
                    ← Back to Home
                </a>
            </div>
        </div>
    </main>

</body>
</html>
